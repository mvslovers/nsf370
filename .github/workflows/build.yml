name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Cross-build of every module and test module on the mbt 3 reusable
  # workflow. The host suite runs in its own job below, not through this
  # workflow's host_tests step, which only runs once the cross-build passed.
  build:
    uses: mvslovers/mbt/.github/workflows/build3.yml@main

  # No assembler card may reach column 72.  IFOX00 applies the continuation
  # rule to COMMENT cards too, so such a card eats the one after it -- and
  # since mbt#94 that is a severity-4 warning the build rule deliberately
  # survives, so `make` exits 0 with the card missing from the object.  This
  # job is the detection that fact removed.  Measured 2026-08-28:
  # nsfctcio.asm:95 swallowed `DCBD DSORG=PS` (every DCB symbol resolved to 0)
  # and nsfvsvc.asm dropped `L R3,REQFUNC(,R8)`, the SVC dispatch value.
  # Needs no toolchain, so it answers in seconds.
  asm-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: No card reaches column 72
        run: tools/check-card-columns.sh

  # Every sock_lookup call site must declare itself CHECKED or INTERNAL.
  # sock_lookup turns a client-supplied descriptor into a SOCKCB and validates
  # nothing about who is asking, so M5-2d1 put the ownership check in
  # nsfreq_sock_owned.  The hole existed because NOBODY SAW sel_scan: one call
  # site was obvious and got the attention, the other resolved N descriptors
  # per SELECT mask and was invisible.  This job makes a new, unclassified
  # caller break the build rather than silently open the door again.
  # Needs no toolchain, so it answers in seconds.
  sock-lookup-callers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Every sock_lookup call site is classified
        run: tools/check-sock-lookup.sh

  # Native host suite (`mbt test`) -- the portable C tests built with the host
  # compiler, no cc370 and no MVS. Kept as its own job, independent of the
  # cross-build: host-only breakage (a non-portable asm() alias, a single-core
  # thread race) must show even while the cross-build is red.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mbt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the newest mbt 3 release; it switches to the pinned one by itself
          TAG=$(gh release list -R mvslovers/mbt --limit 100 --json tagName,isDraft \
                --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("v3."))][0]')
          [ -n "$TAG" ] || { echo "no mbt 3 release on mvslovers/mbt" >&2; exit 3; }
          VER="${TAG#v}"
          cd "$RUNNER_TEMP"
          gh release download "$TAG" -R mvslovers/mbt -p "mbt-$VER-linux-amd64.tar.gz" -p "mbt-$VER-sha256.txt"
          sha256sum -c --ignore-missing "mbt-$VER-sha256.txt"
          tar -xzf "mbt-$VER-linux-amd64.tar.gz"
          install -D "mbt-$VER-linux-amd64/mbt" "$HOME/.mbt-bin/mbt"
          echo "$HOME/.mbt-bin" >> "$GITHUB_PATH"

      - name: Run host test suite
        run: mbt test
